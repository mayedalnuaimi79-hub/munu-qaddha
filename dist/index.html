function steps(n){return `<div class="steps">${['1 · الفرق','2 · الفئات','3 · التحدي'].map((s,i)=>`<span class="${i===n?'active':''}">${s}</span>`).join('')}</div>`}
function gameCard(title,subtitle,mode,art,meta){art=art.replaceAll('id="','id="card-').replaceAll('url(#','url(#card-');return `<article class="game-card"><div class="game-title">${title}</div><div class="game-art ${mode}">${art}<span class="mode-badge">${mode==='classic'?'اللعبة الرئيسية':'جولة جاهزة'}</span></div><div class="game-subtitle">${subtitle}</div><div class="game-bottom"><span>${meta}</span>${button('العب ←','mode:'+mode)}</div></article>`}
function chooseScreen(){const s=stored();let content='';
 if(homeTab==='main')content=`<div class="main-lobby">${gameCard('منو قدّها؟','اختاروا الفئات… والتحدي عليكم!','classic',HERO,'36 سؤالًا · 2–8 فرق')}<div class="intro"><div class="eyebrow">اللعبة اللي تجمعكم</div><h2>السؤال علينا، والفزعة عليكم.</h2><p>كوّنوا فرقكم، اختاروا 6 فئات، وتنافسوا على أعلى رصيد. كل سؤال فرصة تثبتون فيها: منو قدّها؟</p><span class="pill">24 فئة متنوعة</span><span class="pill">3 وسائل مساعدة</span><span class="pill">بدون تسجيل</span></div></div>`;
 if(homeTab==='extra')content=`<div class="row between"><h3>جولات على مزاجكم</h3><span class="help">نفس المسابقة بإعدادات مختلفة</span></div><div class="game-grid">${gameCard('التحدي السريع','وقت أقل، حماس أكثر','quick','<span class="mode-symbol" aria-hidden="true">ϟ</span>','18 سؤالًا · 15 ثانية')}${gameCard('جلسة الربع','خذوا راحتكم وفكّروا مع بعض','chill','<span class="mode-symbol" aria-hidden="true">✦</span>','36 سؤالًا · 60 ثانية')}</div>`;
 if(homeTab==='saved')content=s?`<article class="saved-card"><div class="row between"><h3>${s.used.length===s.deck.length?'آخر جولة مكتملة':'جولتكم بانتظاركم'}</h3><span class="pill">محفوظة على هذا الجهاز</span></div><p class="muted">${s.teams.map(t=>esc(t.name)).join(' · ')}</p><div class="progress" role="progressbar" aria-label="تقدم الجولة" aria-valuemin="0" aria-valuemax="${s.deck.length}" aria-valuenow="${s.used.length}"><i style="width:${Math.round(s.used.length/s.deck.length*100)}%"></i></div><div class="row between"><span class="help">${s.used.length} / ${s.deck.length} سؤالًا</span>${button(s.used.length===s.deck.length?'شوف النتيجة':'نكمل اللعب ←','resume','primary')}</div></article>`:`<div class="empty"><div class="empty-symbol" aria-hidden="true">◷</div><h3>ما عندك جولة محفوظة بعد</h3><p>ابدأوا أول تحدي. بنحفظ تقدمكم تلقائيًا هنا.</p>${button('يلا نلعب','new','primary')}</div>`;
 return `<section class="masthead"><div class="hero-grid"><div class="hero-copy"><div class="eyebrow">من دارنا… لكل جمعة حلوة</div><h1>جمّع ربعك.<br><span>منو قدّها؟</span></h1><p>أسئلة، ضحك، ومنافسة على أصولها.<br>اختاروا فريقكم، وخلّوا الحماس يبدأ!</p><div class="row">${button('يلا نلعب ←','new','yellow')}${s?button('نكمل اللعب','resume','tiny'):''}</div></div><div class="hero-art" role="img" aria-label="رسمة أصلية لثلاثة متنافسين حول طاولة مسابقات"><img class="majlis-hero" src="/art/majlis.jpeg" alt="لمة الأهل في الميلس"><span class="hero-label">كل جمعة… تحدّي يديد ✦</span></div></div><div class="hero-menu"><div class="shortcuts">${button('؟ طريقة اللعب','help')}${button('◷ ألعابي','tab:saved')}${button('ϟ جولة سريعة','mode:quick')}</div><span>2–8 فرق · بدون إنترنت · بدون تسجيل</span></div></section><section class="lobby"><div class="lobby-title"><strong>اختاروا تحدّيكم</strong><small>السؤال واحد… والحماس للجميع</small></div><div class="tabs" role="tablist" aria-label="أقسام الألعاب">${[['main','اللعبة الرئيسية'],['extra','جولات جاهزة'],['saved','ألعابي']].map(([id,title])=>`<button id="tab-${id}" role="tab" aria-selected="${homeTab===id}" aria-controls="lobby-panel" data-act="tab:${id}">${title}</button>`).join('')}</div><div class="letters-promo"><img src="/art/letters.svg" alt="لوحة حروف"><div><div class="eyebrow">لعبة جديدة</div><h2>حروف اللمة</h2><p>فريقين، حروف، وطريق واحد للفوز.</p>${button("العب الحروف","letters","primary")}</div></div><div class="lobby-body" id="lobby-panel" role="tabpanel" aria-labelledby="tab-${homeTab}">${content}</div></section><div class="bottom-note">منو قدّها؟ · لعبة مستقلة للجمعات · نسخة تجريبية</div>`;
}
function render(){stopQuestionSound();const app=$('#app');
 if(view==='auth'){app.innerHTML=authScreen();return}
 if(view==='home'){app.innerHTML=homeScreen();}
 if(view==='choose'){app.innerHTML=chooseScreen();}
 if(view==='store'){app.innerHTML=storeScreen();}
 if(view==='teams'){app.innerHTML=`${steps(0)}<div class="eyebrow">البداية مع الربع</div><h1>من معانا اليوم؟</h1><p class="muted">فريقان أو أكثر… والمنافسة مضمونة.</p><div class="row between"><h3>الفرق <span class="muted">${draft.teams.length} / 8</span></h3>${button('+ أضف فريق','add','quiet',draft.teams.length===8)}</div><div class="teamgrid">${draft.teams.map((t,i)=>`<div class="team-edit"><div class="badge" style="background:${colors[i]}">${i+1}</div><input aria-label="اسم الفريق ${i+1}" maxlength="24" data-team="${i}" value="${esc(t)}">${button('×','remove:'+i,'tiny',draft.teams.length===2)}</div>`).join('')}</div><div class="panel"><div class="row between"><label>وقت السؤال &nbsp; <select id="seconds">${[15,30,45,60].map(s=>`<option ${s===draft.seconds?'selected':''} value="${s}">${s} ثانية</option>`).join('')}</select></label><label class="switch"><input id="penalty" type="checkbox" ${draft.penalty?'checked':''}> خصم 100 عند عدم الإجابة</label></div></div><div class="footerbar">${button('العودة','home','quiet')}${button('اختيار الفئات ←','categories','primary')}</div>`;}
 if(view==='categories'){app.innerHTML=groupedCategoriesScreen();}
 if(view==='board'){app.innerHTML=`${steps(2)}<div class="row between board-heading"><div><div class="eyebrow">الدور على ${esc(game.teams[game.turn].name)}</div><h2>اختاروا فئاتكم وابدأوا المنافسة</h2></div><span class="pill">${game.used.length} / ${game.deck.length} سؤال</span></div>${scores()}<div class="board-scroll"><div class="board poster-board">${game.cats.map((id,i)=>posterCategory(id,i)).join('')}</div></div><div class="footerbar">${button('حفظ والعودة للرئيسية','home','quiet')}${button('تراجع عن آخر نتيجة','undo','quiet',!game.history.length)}</div>`;}
 if(view==='question'){const q=current(),a=game.active,t=game.teams[game.turn];app.innerHTML=`<div class="row between"><span class="pill">${categoryInfo(q.category).name} · ${q.points*(a.double?2:1)} نقطة</span><span class="muted">دور ${esc(t.name)}</span></div><section class="question panel"><div id="timer" class="timer ${a.remaining<=5?'urgent':''}">${a.remaining}</div><div class="row" style="justify-content:center">${button(a.paused?'▶ متابعة':'Ⅱ إيقاف','pause','tiny',a.revealed||a.remaining===0)}</div><div class="qtext">${esc(q.text)}</div>${questionMedia(q)}${a.hint?`<div class="hint">💡 ${esc(q.hint)}</div>`:''}${a.revealed?`<div class="answer">${esc(q.answer)}</div><p class="muted">من جاوب صح؟</p><div class="award">${game.teams.map((x,i)=>button(esc(x.name),'award:'+i,'primary')).join('')}${button('لا أحد','award:-1','quiet')}</div>`:`<div class="row" style="justify-content:center;margin:20px 0">${button('💡 تلميح','hint','tiny',t.help.hint)}${button('⏱ +15 ثانية','extra','tiny',t.help.extra)}${button('✦ دبل النقاط','double','tiny',t.help.double)}</div>${button('اكشف الإجابة','reveal','primary')}`}<p class="help" style="margin-top:20px">${game.penalty?'عدم الإجابة: خصم 100 من صاحب الدور':'بدون خصم عند الإجابة الخاطئة'} · الحكم يحدد الفريق الفائز بالنقاط</p></section><div class="center">${button('حفظ والخروج','home','quiet')}</div>`;}
 if(view==='results'){const order=[...game.teams].sort((a,b)=>b.score-a.score),winners=order.filter(t=>t.score===order[0].score);app.innerHTML=`<div class="center"><div style="font-size:70px">🏆</div><div class="eyebrow">قدّها وقدود… يا أبطال</div><h1>${winners.length>1?'تعادل الأبطال!':'كفو، '+esc(order[0].name)+'!'}</h1><p class="muted">${game.deck.length} سؤالًا، وجمعة مليانة تحدّي.</p></div><div style="max-width:620px;margin:25px auto">${order.map((t,i)=>`<div class="rank"><span class="badge" style="background:${colors[game.teams.indexOf(t)]}">${i+1}</span><div>${esc(t.name)}<div class="help">${t.correct} إجابات صحيحة</div></div><strong>${t.score}</strong></div>`).join('')}</div><div class="row" style="justify-content:center">${button('جولة جديدة بنفس الفرق','replay','primary')}${button('الرئيسية','home','quiet')}${button('تراجع عن آخر نتيجة','undo','quiet',!game.history.length)}</div>`;}
}
function scores(){return `<div class="scorebar">${game.teams.map((t,i)=>`<div class="score ${i===game.turn?'active':''}"><span style="color:var(--ink);border-right:4px solid ${colors[i]};padding-right:8px">${esc(t.name)}</span><strong>${t.score}</strong><small class="muted">${i===game.turn?'◉ صاحب الدور':'◌ جاهز للتحدي'}</small></div>`).join('')}</div>`}
function questionMedia(q){if(q.audio)return soundQuestionMedia(q);return q.image&&/^\/maps\/geo[12345]-\d{2}\.svg$/.test(q.image)?`<figure class="map-question"><img src="${esc(q.image)}" alt="خريطة حدود دولة مطلوب التعرف عليها" width="520" height="360"><figcaption>الشمال للأعلى · حدود مبسطة</figcaption></figure>`:''}
function current(){return game.deck.find(q=>q.id===game.active.id)}

function startClock(){lastTick=Date.now();clock=setInterval(()=>{const a=game?.active;if(!a||a.revealed||a.paused||a.remaining===0){lastTick=Date.now();return}const elapsed=Math.floor((Date.now()-lastTick)/1000);if(!elapsed)return;lastTick+=elapsed*1000;a.remaining=Math.max(0,a.remaining-elapsed);save();const el=$('#timer');if(el){el.textContent=a.remaining;el.classList.toggle('urgent',a.remaining<=5)}if(a.remaining===0){render();toast('انتهى الوقت! اكشفوا الإجابة.')}},200)}
function award(index){if(!game.active?.revealed)return;const q=current();game.history.push({teams:structuredClone(game.teams),turn:game.turn,used:[...game.used],active:structuredClone(game.active)});if(index>=0){game.teams[index].score+=q.points*(game.active.double&&index===game.turn?2:1);game.teams[index].correct++}else if(game.penalty){game.teams[game.turn].score-=100}game.used.push(q.id);game.active=null;game.turn=(game.turn+1)%game.teams.length;save();go(game.used.length===game.deck.length?'results':'board')}
$('#app').addEventListener('input',e=>{if(e.target.dataset.team!==undefined)draft.teams[+e.target.dataset.team]=e.target.value;if(e.target.id==='seconds')draft.seconds=+e.target.value;if(e.target.id==='penalty')draft.penalty=e.target.checked});
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const [action,arg]=b.dataset.act.split(':');
 if(view==='auth')return;
 if(action==='play'){homeTab='main';go('choose')}
 if(action==='store')go('store');
 if(action==='account'){clearAuthPasswords();authState.accepted=false;authMode='login';go('auth')}
 if(action==='new'||action==='mode'){if(stored()&&!confirm('بدء لعبة جديدة سيستبدل اللعبة المحفوظة عند بدء التحدي. نكمل؟'))return;draft.perCategory=arg==='quick'?3:6;draft.seconds=arg==='quick'?15:arg==='chill'?60:30;go('teams')}
 if(action==='tab'&&['main','extra','saved'].includes(arg)){homeTab=arg;go('choose')}
 if(action==='help')showHelp();
 if(action==='resume'){game=stored();if(game)go(game.active?'question':game.used.length===game.deck.length?'results':'board')}
 if(action==='home'){if(game){if(game.active&&!game.active.revealed)game.active.paused=true;save()}go('home')}
 if(action==='teams')go('teams');
 if(action==='add'&&draft.teams.length<8){draft.teams.push('فريق '+(draft.teams.length+1));render()}
 if(action==='remove'&&draft.teams.length>2){draft.teams.splice(+arg,1);render()}
 if(action==='categories'){activeCategoryGroup=null;const names=draft.teams.map(t=>t.trim());if(names.some(t=>!t)||new Set(names).size!==names.length){toast('اكتب اسمًا مختلفًا لكل فريق، ولا تتركه فارغًا.');return}draft.teams=names;go('categories')}
 if(action==='cat'){const keepY=window.scrollY||0;if(draft.cats.includes(arg))draft.cats=draft.cats.filter(c=>c!==arg);else if(draft.cats.length<6)draft.cats.push(arg);else{toast('اختر 6 فئات فقط؛ ألغِ فئة لتختار غيرها.');return}render();window.scrollTo(0,keepY)}
 if(action==='start'&&draft.cats.length===6)start();
 if(action==='q'&&!game.active&&!game.used.includes(arg)&&game.deck.some(q=>q.id===arg)){game.active={id:arg,remaining:game.seconds,paused:false,revealed:false,hint:false,double:false};save();go('question')}
 if(action==='pause'&&!game.active.revealed){game.active.paused=!game.active.paused;lastTick=Date.now();save();render()}
 if(action==='reveal'){game.active.revealed=true;save();render()}
 if(['hint','extra','double'].includes(action)&&!game.active.revealed){const t=game.teams[game.turn];if(t.help[action])return;t.help[action]=true;if(action==='hint')game.active.hint=true;if(action==='extra'){game.active.remaining+=15;lastTick=Date.now()}if(action==='double')game.active.double=true;save();render()}
 if(action==='award')award(+arg);
 if(action==='undo'&&game.history.length){const h=game.history.pop();Object.assign(game,h);save();go(game.active?'question':game.used.length===game.deck.length?'results':'board')}
 if(action==='replay'){draft={teams:game.teams.map(t=>t.name),cats:[...game.cats],seconds:game.seconds,penalty:game.penalty,perCategory:game.perCategory||6};start()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game?.active&&!game.active.revealed){game.active.paused=true;save();if(view==='question')render()}});
function homeScreen(){const saved=stored();return `<section class="start-scene"><div class="start-shade"></div><div class="start-top"><span>ميلسنا يجمعكم</span>${button('؟ طريقة اللعب','help','start-help')}</div><div class="start-grid"><nav class="start-actions" aria-label="القائمة الرئيسية"><button class="start-button start-play" data-act="play"><strong>العب الآن</strong><span>متاحة للعب · 1008 أسئلة</span></button><button class="start-button letters-entry" data-act="letters">حروف اللمة · لعبة جديدة</button><button class="start-button" data-act="store">المتجر</button><button class="start-button" data-act="account">حسابي</button>${saved?button('◷ نكمل الجولة المحفوظة','resume','resume-link'):''}</nav><div class="start-brand"><div class="start-logo">منو<br><span>قدّها؟</span></div><h1>التحدي يحلى بلمتكم</h1><div class="start-feature"><span class="feature-star" aria-hidden="true">✦</span><strong>ربعك جاهزين للتحدي؟</strong><p>جرّبوا الجولة السريعة</p>${button('18 سؤالًا · يلا نبدأ ϟ','mode:quick','feature-button')}</div></div></div><p class="start-foot">أضفنا 432 سؤالا · ابدأ جولة جديدة · سجل الملعوب محفوظ<br>على جهاز واحد · نسخة تجريبية · بدون مشتريات فعلية</p></section>`}
function storeScreen(){return `<div class="store-page"><div class="row between"><h1>المتجر</h1>${button('العودة للقائمة','home','quiet')}</div><p class="muted">حزم الأسئلة المتاحة للعبة منو قدّها؟</p><article class="panel store-pack"><span class="pill">متوفرة للتجربة</span><h2>حزمة البداية</h2><p>24 فئة و1008 أسئلة، مع جولة كاملة أو سريعة.</p>${button('العب بحزمة البداية','play','primary')}</article><div class="panel"><h3>حزم إضافية</h3><p class="muted">غير متوفرة حاليًا. لم يتم تفعيل الدفع أو شراء الحزم في هذه النسخة.</p></div></div>`}

// Step 1 is an honest UI preview. No credentials are persisted or transmitted.
const AUTH_NOTICE='هذه معاينة للشاشة فقط. خدمة الحسابات لم تربط بعد، ولم يتم إنشاء حساب أو تسجيل دخول. استخدم بيانات تجريبية فقط.';
let authMode='login';
let authState={name:'',email:'',password:'',confirm:'',accepted:false,visible:false};
function authField(key,label,type,autocomplete){return `<label class="auth-field" for="auth-${key}">${label}<input id="auth-${key}" data-auth="${key}" type="${type}" value="${esc(authState[key])}" autocomplete="${autocomplete}" ${key==='name'?'maxlength="40"':'dir="ltr"'} ${key==='email'?'inputmode="email" spellcheck="false"':''} aria-describedby="auth-feedback"></label>`}
function authScreen(){const signup=authMode==='signup';return `<section class="auth-layout"><aside class="auth-welcome"><div class="auth-welcome-copy"><span class="auth-kicker">حيّاك في جمعتنا</span><h1>كل تحدي حلو،<br>يبدأ <span>بجمعة.</span></h1><p>سجّل دخولك، جمّع ربعك، وخلّنا نشوف…<br>منو قدّها؟</p><div class="auth-chips"><span>أسئلة وتحديات</span><span>وناسة مع الربع</span></div></div><div class="auth-illustration" aria-hidden="true">${HERO}</div></aside><section class="auth-card"><div class="auth-heading"><span class="auth-mini-logo" aria-hidden="true">؟</span><div><h2>${signup?'إنشاء حساب':'تسجيل الدخول أو إنشاء حساب'}</h2><p>${signup?'أنشئ حسابك وخلّ التحدي يبدأ.':'سجّل دخولك، وجمعتك بانتظارك.'}</p></div></div><form id="auth-form" novalidate>${signup?authField('name','الاسم','text','nickname'):''}${authField('email','البريد الإلكتروني','email','username')}<div class="password-wrap">${authField('password','كلمة المرور',authState.visible?'text':'password',signup?'new-password':'current-password')}<button id="password-toggle" type="button" class="show-password" data-auth-action="visibility" aria-label="${authState.visible?'إخفاء كلمة المرور':'إظهار كلمة المرور'}">${authState.visible?'إخفاء':'إظهار'}</button></div>${signup?`<p class="password-tip">8 أحرف على الأقل، ويمكن استخدام عبارة طويلة.</p>${authField('confirm','تأكيد كلمة المرور',authState.visible?'text':'password','new-password')}`:`<div class="forgot-row"><button type="button" class="auth-link" data-auth-action="reset">نسيت كلمة المرور؟</button></div>`}<div class="consent-row"><input id="auth-consent" type="checkbox" ${authState.accepted?'checked':''} aria-describedby="consent-hint"><div><label for="auth-consent">أوافق على شروط الاستخدام وسياسة الخصوصية.</label><div class="policy-links"><button type="button" data-auth-action="policy:terms">شروط الاستخدام</button><span>·</span><button type="button" data-auth-action="policy:privacy">سياسة الخصوصية</button></div></div></div><p id="consent-hint" class="consent-hint">حدد مربع الموافقة للمتابعة. السياسات المعروضة قيد الإعداد.</p><div id="auth-feedback" class="auth-feedback hidden" role="alert" aria-live="polite"></div><button id="email-submit" type="submit" class="primary auth-submit" ${authState.accepted?'':'disabled'}>${signup?'إنشاء حساب':'تسجيل دخول'} <span aria-hidden="true">←</span></button><button type="button" class="auth-secondary" data-auth-action="mode:${signup?'login':'signup'}">${signup?'عندي حساب · تسجيل الدخول':'إنشاء حساب'}</button><div class="auth-divider"><span>أو</span></div><button id="apple-submit" type="button" class="apple-signin" data-auth-action="apple" ${authState.accepted?'':'disabled'} aria-label="تسجيل الدخول باستخدام Apple"><span dir="ltr">Sign in with Apple</span></button><p class="auth-preview-note">معاينة التصميم · الربط بالحسابات وApple غير مفعّل.<br>لا تدخل كلمة مرور تستخدمها فعليًا.</p></form><button type="button" class="auth-home" data-auth-action="back">العودة للقائمة الرئيسية</button></section></section>`}
function authError(message){const box=$('#auth-feedback');if(box){box.textContent=message;box.classList.remove('hidden')}}
function authValidate(method='email'){
 if(!authState.accepted)return 'وافق على شروط الاستخدام وسياسة الخصوصية أولًا.';
 if(method==='apple')return '';

// Persistent dealt-question history. Text-based keys survive bank reordering.
const SEEN_KEY='munu-dealt-questions-v1';
const questionKey=(category,text)=>category+'|'+text.normalize('NFKC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/\s+/g,' ').trim();
function readSeen(){
 const raw=localStorage.getItem(SEEN_KEY);
 if(raw===null){
  const old=stored();
  const keys=old?old.deck.map(q=>questionKey(q.category,q.text)):[];
  const data={version:1,keys:[...new Set(keys)]};
  localStorage.setItem(SEEN_KEY,JSON.stringify(data));
  return new Set(data.keys);
 }
 const data=JSON.parse(raw);
 if(data?.version!==1||!Array.isArray(data.keys)||!data.keys.every(k=>typeof k==='string'))throw new Error('Invalid question history');
 return new Set(data.keys);
}
function writeSeen(seen){localStorage.setItem(SEEN_KEY,JSON.stringify({version:1,keys:[...seen]}))}
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function availableQuestions(c,seen){return c.questions.map((q,i)=>({id:c.id+'-'+i,category:c.id,points:q[0],text:q[1],answer:q[2],hint:q[3],...(c.images?.[i]?{image:c.images[i]}:{}),...(c.audio?.[i]?{audio:c.audio[i]}:{})})).filter(q=>!seen.has(questionKey(c.id,q.text)))}
function remainingText(c,seen){
 if(!seen)return '<span class="freshness-unavailable">تعذر قراءة سجل الأسئلة</span>';
 const a=availableQuestions(c,seen),total=c.questions.length;
 const rounds=Math.min(...[200,400,600].map(p=>Math.floor(a.filter(q=>q.points===p).length/((draft.perCategory||6)/3))));
 const used=total-a.length;
 const percent=total?(used===total?100:Math.min(99,Math.round(used/total*100))):0;
 const status=rounds===0?'empty':rounds===1?'low':'ready';
 const roundText=rounds===0?(a.length?'المتبقي لا يكفي جولة بهذا النمط':'خلصت الأسئلة الجديدة'):rounds===1?'باقي جولة بدون تكرار':rounds===2?'باقي جولتين بدون تكرار':`باقي ${rounds} جولات بدون تكرار`;
 return `<span class="freshness ${status}"><span class="freshness-heading"><span>نسبة الاستخدام</span><b>${percent}٪</b></span><span class="freshness-track" role="meter" aria-label="الأسئلة المستخدمة في ${esc(c.name)}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${used}" aria-valuetext="استخدمت ${used} من ${total} سؤال"><span style="width:${percent}%"></span></span><span class="freshness-count">استخدمت ${used} من ${total} · باقي ${a.length}</span><span class="freshness-rounds">${roundText}</span></span>`;
}
function showExhausted(ids){
 const names=ids.map(id=>BANK.find(c=>c.id===id).name).join('، ');
 $('#dialog-content').innerHTML=`<h2>خلصت الأسئلة الجديدة لهالجولة</h2><p>ما بقي عدد كاف من أسئلة كل مستوى في: <strong>${esc(names)}</strong>.</p><p>اختاروا فئات ثانية، أو أعيدوا أسئلة هالفئات بموافقتكم. ما بدأنا جولة ولا غيرنا الجولة المحفوظة.</p><div class="row">${button('اختيار فئات ثانية','freshcategories','primary')}${button('السماح بإعادة هالفئات','recycle:'+ids.join(','),'quiet')}</div><p class="help">تقدرون أيضا تجربون الجولة السريعة إذا بقي سؤال جديد من كل مستوى.</p>`;
 $('#dialog').showModal();
}
function start(){
 draft.cats=draft.cats.filter(id=>BANK.some(c=>c.id===id));
 if(draft.cats.length!==6){go('categories');toast('اختر 6 فئات متاحة لبدء الجولة الجديدة.');return}
 let seen;try{seen=readSeen()}catch{toast('تعذر حفظ سجل الأسئلة. اسمح بالتخزين في المتصفح حتى نمنع التكرار.');return}
 const deck=[],exhausted=[],perCategory=draft.perCategory||6,each=perCategory/3;
 for(const id of draft.cats){const c=BANK.find(x=>x.id===id),pool=availableQuestions(c,seen);if([200,400,600].some(p=>pool.filter(q=>q.points===p).length<each)){exhausted.push(id);continue}for(const points of [200,400,600])deck.push(...shuffled(pool.filter(q=>q.points===points)).slice(0,each))}
 if(exhausted.length){showExhausted(exhausted);return}
 // Reserve the complete deck before opening it. Abandoned rounds cannot repeat.
 for(const q of deck)seen.add(questionKey(q.category,q.text));
 try{writeSeen(seen)}catch{toast('تعذر حفظ سجل الأسئلة؛ لم تبدأ الجولة حتى لا تتكرر أسئلتك.');return}
 game={version:1,teams:draft.teams.map(name=>({name:name.trim(),score:0,correct:0,help:{hint:false,extra:false,double:false}})),cats:[...draft.cats],seconds:draft.seconds,penalty:draft.penalty,perCategory,turn:0,used:[],history:[],active:null,deck};
 save();go('board');
}
$('#dialog-content').addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const [action,arg]=b.dataset.act.split(':');

 if(action==='recycle'){
  const ids=arg.split(',').filter(id=>draft.cats.includes(id));
  if(!ids.length)return;
  try{const seen=readSeen();for(const key of seen)if(ids.some(id=>key.startsWith(id+'|')))seen.delete(key);writeSeen(seen)}catch{toast('تعذر حفظ سجل الأسئلة.');return}
  $('#dialog').close();start();
 }
});

function letterBank(lang=letterLanguage){return lang==='en'?LETTER_BANK_EN:LETTER_BANK}
function letterKey(lang,text){return questionKey(lang==='en'?'letters-en':'letters',text)}
function letterChoices(row,seen,lang){const result=[];for(let n=1;n<row.length;n+=2)if(!seen.has(letterKey(lang,row[n])))result.push(n);return result}
function letterStats(lang=letterLanguage){
 const seen=new Set(letterSeen()),rows=letterBank(lang).map(row=>({letter:row[0],total:(row.length-1)/2,left:letterChoices(row,seen,lang).length}));
 const total=rows.reduce((n,r)=>n+r.total,0),left=rows.reduce((n,r)=>n+r.left,0),used=total-left;
 let rounds=0;for(let r=1;r<=Math.floor(left/25);r++)if(rows.reduce((n,x)=>n+Math.min(x.left,r),0)>=25*r)rounds=r;
 return {rows,total,left,used,percent:used===total?100:Math.min(99,Math.round(used/total*100)),rounds,ready:rows.filter(r=>r.left>0).length>=25};
}
function letterLanguageLabel(lang){return lang==='en'?'English · إنجليزي':'العربية'}
function letterProgress(lang,compact=false){try{const x=letterStats(lang);return `<div class="letter-progress ${compact?'compact':''}"><div class="row between"><strong>${letterLanguageLabel(lang)}</strong><span><b dir="ltr">${x.percent}%</b> مستخدم</span></div><progress max="${x.total}" value="${x.used}" aria-label="نسبة استخدام أسئلة ${letterLanguageLabel(lang)}"></progress><p>${x.left} من ${x.total} سؤال متبقٍ${compact?'':` · نحو ${x.rounds} جولات كاملة`}</p>${compact?'':`<p class="help">التقدير للوحة من 25 حرفا وسؤال واحد لكل حرف. التخطي يستهلك أسئلة إضافية، وقد تنتهي الجولة قبل فتح كل الحروف. لا نكرر الأسئلة تلقائيا.</p><details><summary>المتبقي لكل حرف</summary><div class="letter-inventory">${x.rows.map(r=>`<span class="${r.left?'':'empty'}"><b>${r.letter}</b> ${r.left}/${r.total}</span>`).join('')}</div></details>`}</div>`}catch{return '<p role="alert">تعذر قراءة سجل الحروف. الأسئلة لن تتكرر تلقائيا؛ تحقق من السماح بالتخزين على جهازك.</p>'}}

function letterSave(){try{localStorage.setItem(LETTER_KEY,JSON.stringify(letters))}catch{toast('تعذر حفظ لعبة الحروف على الجهاز.')}}
function letterSeen(){const raw=localStorage.getItem(LETTER_SEEN);if(!raw)return [];const x=JSON.parse(raw);if(!Array.isArray(x))throw Error('history');return x}
function letterNeighbors(i){const r=Math.floor(i/5),c=i%5;return [[r,c-1],[r,c+1],[r-1,c+(r%2?0:-1)],[r-1,c+(r%2?1:0)],[r+1,c+(r%2?0:-1)],[r+1,c+(r%2?1:0)]].filter(([a,b])=>a>=0&&a<5&&b>=0&&b<5).map(([a,b])=>a*5+b)}
function letterWinningPath(cells,team){
 const queue=[],parent=new Map();
 for(let i=0;i<25;i++)if(cells[i].owner===team&&(team===0?i%5===0:i<5)){queue.push(i);parent.set(i,null)}
 for(let p=0;p<queue.length;p++){const i=queue[p];if(team===0?i%5===4:i>=20){const path=[];for(let n=i;n!==null;n=parent.get(n))path.push(n);return path.reverse()}
  for(const n of letterNeighbors(i))if(cells[n].owner===team&&!parent.has(n)){parent.set(n,i);queue.push(n)}
 }return [];
}
function letterWinner(cells,team){return letterWinningPath(cells,team).length>0}
function letterCheckFinish(){if(!letters)return;letters.winningPath=[];letters.winner=null;for(const t of [0,1]){const path=letterWinningPath(letters.cells,t);if(path.length){letters.winner=t;letters.winningPath=path;letters.active=null;break}}}

function letterSetup(){return `<section class="panel letter-setup"><img src="/art/letters.svg" alt="خلايا حروف" width="150"><div class="eyebrow">تحدي على نفس الجهاز</div><h1>حروف اللمة</h1><p>جاوبوا، امتلكوا الحرف، ووصلوا طرفي اللوحة!</p><div class="letter-language-picker" role="group" aria-label="لغة أسئلة الحروف">${['ar','en'].map(lang=>`<button data-act="letters-lang:${lang}" aria-pressed="${letterLanguage===lang}" class="${letterLanguage===lang?'primary':''}">${letterLanguageLabel(lang)}</button>`).join('')}</div>${letterProgress(letterLanguage)}<div class="teamgrid"><label>الفريق الفيروزي <input id="letter-name-0" maxlength="24" value="${esc(letterNames?.[0]||letters?.names[0]||'الصقور')}"></label><label>الفريق الذهبي <input id="letter-name-1" maxlength="24" value="${esc(letterNames?.[1]||letters?.names[1]||'الفرسان')}"></label></div><p>الفيروزي يوصل اليمين باليسار، والذهبي يوصل فوق بتحت. الإجابة تبدأ بالحرف المختار. سجلوا صاحب الإجابة الصحيحة؛ اللعبة تنهي الجولة تلقائيا عندما يتصل طرفا الفريق.</p><div class="row">${button('ابدأوا التحدي','letters-start','primary')}${letters?button('نكمل اللوحة المحفوظة · '+letterLanguageLabel(letters.lang),'letters-resume'):''}${button('اختيار الألعاب','play','quiet')}</div><details><summary>إدارة سجل أسئلة الحروف</summary><p>سجل مستقل لكل لغة على هذا المتصفح. السؤال ينحسب عند فتحه، حتى لو تخطيته. إعادة السجل تسمح بتكرار أسئلة اللغة المختارة فقط.</p>${button('إعادة أسئلة '+letterLanguageLabel(letterLanguage),'letters-reset','tiny')}</details></section>`}
function letterBoard(){const g=letters;return `<section class="letter-shell ${g.winner!==null?'finished':''}">${g.winner!==null?letterFinishBanner():''}<div class="row between"><div><div class="eyebrow">حروف اللمة · ${letterLanguageLabel(g.lang)}</div><h2>${g.winner!==null?'فاز '+esc(g.names[g.winner])+'!':'الدور على '+esc(g.names[g.turn])}</h2></div>${button('طريقة اللعب','letters-help','tiny')}</div><div class="letter-scores">${g.names.map((n,i)=>`<div class="letter-team team-${i} ${g.turn===i?'current':''}"><strong>${esc(n)}</strong><span>${i===0?'يمين ↔ يسار':'فوق ↕ تحت'} · ${g.cells.filter(c=>c.owner===i).length} حروف</span></div>`).join('')}</div>${letterProgress(g.lang,true)}${g.active?letterQuestion():`<div class="hex-wrap"><svg viewBox="-16 -15 615 510" class="hex-board" aria-label="لوحة الحروف، 25 خلية"><path d="M-8 0v470M580 0v470" stroke="#157e85" stroke-width="15"/><path d="M4 -7h565M4 480h565" stroke="#d79818" stroke-width="15"/>${g.cells.map((c,i)=>{const x=60+(i%5)*100+(Math.floor(i/5)%2)*50,y=60+Math.floor(i/5)*86;return `<g role="button" tabindex="${c.owner===null&&g.winner===null?0:-1}" aria-disabled="${c.owner!==null||g.winner!==null}" aria-label="حرف ${c.letter}${c.owner!==null?'، '+esc(g.names[c.owner]):''}" data-act="letter-cell:${i}" class="hex-cell owner-${c.owner} ${(g.winningPath||[]).includes(i)?'winning-cell':''}"><polygon points="${[[0,-58],[50,-29],[50,29],[0,58],[-50,29],[-50,-29]].map(([a,b])=>`${x+a},${y+b}`).join(' ')}"/><text x="${x}" y="${y+13}" text-anchor="middle">${c.letter}</text></g>`}).join('')}</svg></div><p class="help center">اختاروا حرفا. الخلايا المتلامسة تصنع طريق الفوز.</p>`}<div class="row letter-tools">${button('تراجع عن آخر حركة','letters-undo','tiny',!g.history.length)}${button('بدل الدور','letters-turn','tiny',!!g.active||g.winner!==null)}${button('لوحة جديدة','letters-new','tiny')}${button('حفظ وخروج','letters-exit','tiny')}</div></section>`}
function letterQuestion(){const a=letters.active;return `<section class="panel letter-question"><span class="letter-token">${letters.cells[a.index].letter}</span><p class="help">الإجابة تبدأ بهذا الحرف · سجلوا صاحب الإجابة الصحيحة</p><h2 lang="${letters.lang==='en'?'en':'ar'}" dir="${letters.lang==='en'?'ltr':'rtl'}">${esc(a.q)}</h2>${a.revealed?`<div class="answer" lang="${letters.lang==='en'?'en':'ar'}" dir="${letters.lang==='en'?'ltr':'rtl'}">${esc(a.answer)}</div><div class="row">${letters.names.map((n,i)=>button('إجابة صحيحة لـ '+esc(n),'letters-award:'+i,'primary')).join('')}</div>`:button('اكشف الإجابة','letters-reveal','primary')}<div class="row" style="margin-top:20px">${button('لا أحد · انتقل الدور','letters-pass','tiny')}</div></section>`}
function letterOpen(index){if(!letters||letters.active||letters.winner!==null||!Number.isInteger(index)||index<0||index>24||letters.cells[index].owner!==null)return;try{const seen=letterSeen(),row=letterBank(letters.lang).find(r=>r[0]===letters.cells[index].letter),pool=row?letterChoices(row,new Set(seen),letters.lang):[];if(!pool.length){toast('خلصت أسئلة هالحرف. اختاروا حرف ثاني أو اسمحوا بالتكرار من إعدادات الحروف.');return}const n=pool[Math.floor(Math.random()*pool.length)];localStorage.setItem(LETTER_SEEN,JSON.stringify([...seen,letterKey(letters.lang,row[n])]));letters.active={index,q:row[n],answer:row[n+1],revealed:false};letterSave();render()}catch{toast('تعذر قراءة أو حفظ سجل الحروف؛ لم يفتح السؤال.')}}
function letterAward(team){if(!letters?.active?.revealed||![0,1].includes(team))return;letters.history.push({cells:structuredClone(letters.cells),turn:letters.turn,active:structuredClone(letters.active),winner:letters.winner});letters.cells[letters.active.index].owner=team;letters.active=null;letterCheckFinish();if(letters.winner===null)letters.turn=1-letters.turn;letterSave();render()}

 letters={version:1,lang:letterLanguage,names,cells:rows.map(x=>({letter:x.row[0],owner:null})),turn:0,winner:null,active:null,history:[]};letterNames=names;letterSave();go('letters-board')

function miniPick(kind){const pool=miniPool(kind);if(!pool)return null;const seen=miniSeen(),used=seen[kind]||[],remaining=pool.map((v,i)=>i).filter(i=>!used.includes(i));if(!remaining.length)return false;const i=remaining[Math.floor(Math.random()*remaining.length)];seen[kind]=[...used,i];try{localStorage.setItem('munu-mini-history-v1',JSON.stringify(seen))}catch{toast('تعذر حفظ سجل التحدي في المتصفح.')}return pool[i]}
function miniOpen(id){miniStop();const item=REFERENCE_ITEMS.find(x=>x[0]===id);if(!item)return;mini={id,kind:item[4],title:item[1],phase:'intro',scores:[0,0],result:'',turn:0};go('mini-game')}
function miniStart(){miniStop();const m=mini;Object.assign(m,{phase:'play',result:'',done:false,started:Date.now(),reveal:false,picked:[],matched:[],errors:0,attempts:0,guesses:[],taps:0,step:0,paint:[],color:'#ed334b',drawing:false});m.prompt=miniPick(m.kind);if(m.prompt===false){m.phase='empty';render();return}
 const k=m.kind;
 if(k==='memory')m.tiles=shuffled(['🍋','🍋','🚗','🚗','🌴','🌴','⚽','⚽','🦋','🦋','🏠','🏠']);
 if(['find','difference'].includes(k)){m.odd=Math.floor(Math.random()*36);m.tiles=Array.from({length:36},(_,i)=>i===m.odd?'🔓':'🔒')}
 if(k==='puzzle'){m.tiles=shuffled([0,1,2,3,4,5,6,7,8]);if(m.tiles.every((n,i)=>n===i))m.tiles.reverse();m.photo='/art/uae.svg'}
 if(['word','scramble','moving','hangman'].includes(k)){m.answer=m.prompt;m.scramble=shuffled([...m.answer]).join(' · ')}
 if(k==='nodots')m.answer=m.prompt[1];
 if(['right','sum'].includes(k)){m.a=10+Math.floor(Math.random()*80);m.b=10+Math.floor(Math.random()*80);m.answer=m.a+m.b;m.options=shuffled([m.answer,m.answer+10,m.answer-1,m.answer+1])}
 if(k==='missing'){m.base=2+Math.floor(Math.random()*8);m.answer=m.base*5;m.options=shuffled([m.answer,m.answer+1,m.answer-2,m.answer+m.base])}
 if(k==='percent')m.count=5+Math.floor(Math.random()*91);
 if(k==='wall'){m.base=2+Math.floor(Math.random()*7);m.tiles=shuffled(Array.from({length:20},(_,i)=>i+1))}
 if(k==='trace')m.tiles=shuffled([1,2,3,4,5,6,7,8,9]);
 if(k==='flag-color')m.paint=['#ffffff','#ffffff','#ffffff','#ffffff'];
 if(['pixels','zoom'].includes(k)){m.photo='/art/rak-v2.jpg';m.answer='جبال';m.step=0}
 if(k==='map'){m.cities=[['لندن',20,22],['القاهرة',54,56],['دبي',80,65],['روما',36,32],['إسطنبول',56,35],['الرياض',71,72]];m.target=Math.floor(Math.random()*m.cities.length)}
 if(k==='chain'){m.words=['قمر'];m.answer='ر'}
 if(['words-memory','lights'].includes(k)){m.sequence=k==='words-memory'?shuffled(['بحر','جبل','قمر','بيت','شمس','نهر']).slice(0,4):Array.from({length:3},()=>Math.floor(Math.random()*4));m.phase='watch';m.tick=0}
 if(k==='flash'){m.options=shuffled(['⭐','🌙','☀️','⚡']);m.answer=m.options[Math.floor(Math.random()*4)];m.phase='watch'}
 if(k==='cups'){m.cup=0;m.order=[0,1,2];m.phase='watch';m.tick=0}
 if(k==='fly'){m.y=50;m.velocity=0;m.x=95;m.gap=50;m.taps=0}
 if(k==='bomb')m.limit=20+Math.floor(Math.random()*25);
 if(['tap','ten','half','bomb','fly'].includes(k))miniTimer=setInterval(miniTick,k==='fly'?70:50);
 if(['words-memory','lights','flash','cups'].includes(k))miniTimer=setInterval(miniWatch, k==='flash'?1000:k==='words-memory'?4000:650);
 if(['draw','blind','line','charades','group','imitate','forehead','concept','popular','auction','names'].includes(k)){m.remaining=60;miniTimer=setInterval(()=>{if(view!=='mini-game'){miniStop();return}m.remaining=Math.max(0,60-Math.floor((Date.now()-m.started)/1000));const el=$('#mini-seconds');if(el)el.textContent=m.remaining;if(!m.remaining){miniStop();m.done=true;m.result='انتهى الوقت! سجلوا نتيجة الفريق.';render()}},250)}
 render();
}
function miniWatch(){if(view!=='mini-game'){miniStop();return}const m=mini,k=m.kind;if(k==='cups'){m.tick++;if(m.tick<7){const a=m.tick%3,b=(a+1)%3;[m.order[a],m.order[b]]=[m.order[b],m.order[a]];render();return}}else if(k==='lights'){m.tick++;if(m.tick<m.sequence.length*2){render();return}}miniStop();m.phase='play';render()}
function miniTick(){if(view!=='mini-game'){miniStop();return}const m=mini,t=(Date.now()-m.started)/1000;
 if(m.kind==='tap'){const e=$('#mini-seconds');if(e)e.textContent=Math.max(0,10-t).toFixed(1);if(t>=10)miniFinish('خلص الوقت! سجلت '+m.taps+' ضغطة.')}
 if(m.kind==='bomb'&&t>=m.limit)miniFinish('💥 انفجرت القنبلة! اللاعب الذي يمسك الجهاز خسر الجولة.');
 if(m.kind==='half'){m.position=(Math.sin(t*2.1-Math.PI/2)+1)*50;const e=$('#mini-marker');if(e)e.style.left=m.position+'%'}
 if(m.kind==='fly'){m.velocity+=0.16;m.y+=m.velocity;m.x-=2;if(m.x<0){m.x=100;m.gap=25+Math.random()*50;m.taps++;if(m.taps>=10){miniFinish('وصلت! جمعت 10 نجوم.');return}}if(m.y<2||m.y>96||(m.x<24&&m.x>14&&Math.abs(m.y-m.gap)>22)){miniFinish('انتهت الرحلة. جمعت '+m.taps+' نجوم.');return}const b=$('#mini-bird'),p=$('#mini-pipe');if(b)b.style.top=m.y+'%';if(p){p.style.left=m.x+'%';p.style.background=`linear-gradient(to bottom,#543781 ${m.gap-22}%,transparent ${m.gap-22}%,transparent ${m.gap+22}%,#543781 ${m.gap+22}%)`}}
}
function miniFinish(message){miniStop();mini.done=true;mini.result=message;render()}
function miniCorrect(ok){miniFinish(ok?'صح! نقطة لك ✓':'مو صحيح. جرب تحديا جديدا.');if(ok)mini.scores[mini.turn]++;render()}
function miniTeamNames(){return [draft.teams?.[0]||'الفريق الأول',draft.teams?.[1]||'الفريق الثاني']}
function miniScreen(){const m=mini,k=m.kind,pool=miniPool(k),used=miniSeen()[k]?.length||0;let body='';
 if(m.phase==='intro')body=`<div class="mini-intro-icon">${REFERENCE_ITEMS.find(x=>x[0]===m.id)[2]}</div><p>${miniDescription(k)}</p><p class="help">قواعد نسخة منو قدها؟ · على نفس الجهاز</p>${button('ابدأ التحدي','mini-start','primary')}`;
 else if(m.phase==='empty')body=`<h2>خلصت تحديات هاللعبة الجديدة</h2><p>ما نعيدها بدون اختيارك.</p>${button('السماح بتكرار هاللعبة','mini-recycle','quiet')}`;
 else{
  if(k==='memory')body=`<div class="mini-grid four">${m.tiles.map((v,i)=>button(m.matched.includes(i)||m.picked.includes(i)?v:'؟','mini-tile:'+i,'mini-tile',m.done||m.matched.includes(i))).join('')}</div><p>الأزواج: ${m.matched.length/2} / 6 · المحاولات: ${m.attempts}</p>${m.picked.length===2&&!m.done?button('إخفاء البطاقتين','mini-hide','quiet'):''}`;
  else if(['find','difference','wall','trace'].includes(k))body=`<h2>${k==='wall'?'اضغط مضاعفات '+m.base:k==='trace'?'التالي: '+(m.step+1):'وين المختلف؟'}</h2><div class="mini-grid ${k==='trace'?'three':'six'}">${m.tiles.map((v,i)=>button(String(v),'mini-tile:'+i,'mini-tile '+(m.matched.includes(i)?'won':''),m.done||m.matched.includes(i))).join('')}</div>`;
  else if(k==='puzzle')body=`<p>بدّل قطعتين. الأرقام تساعدك تتبع ترتيب الصورة من اليسار لليمين.</p><div class="mini-puzzle" dir="ltr">${m.tiles.map((v,i)=>`<button data-act="mini-tile:${i}" class="${m.picked.includes(i)?'chosen':''}" style="background-image:url('${m.photo}');background-size:300% 300%;background-position:${v%3*50}% ${Math.floor(v/3)*50}%" ${m.done?'disabled':''}><span>${v+1}</span></button>`).join('')}</div>`;
  else if(['yesno','lie','bone','part'].includes(k))body=`<h2>${esc(m.prompt[0])}</h2><div class="mini-options">${m.prompt[1].map((v,i)=>button(v,'mini-answer:'+i,'quiet',m.done)).join('')}</div>${m.done?'<p>الإجابة: '+esc(m.prompt[1][m.prompt[2]])+'</p>':''}`;
  else if(['sum','right','missing'].includes(k))body=`<h2 dir="ltr">${k==='missing'?[1,2,3,4].map(n=>n*m.base).join(' , ')+' , ?':m.a+' + '+m.b+' = ?'}</h2>${k==='sum'?miniInput():`<div class="mini-options">${m.options.map(v=>button(String(v),'mini-number:'+v,'quiet',m.done)).join('')}</div>`}`;
  else if(['word','scramble','moving','nodots'].includes(k))body=`<h2 class="mini-word ${k==='moving'?'moving':''}">${esc(k==='nodots'?m.prompt[0]:m.scramble)}</h2>${miniInput()}`;
  else if(k==='hangman')body=`<h2>${[...m.answer].map(c=>m.guesses.includes(c)?c:'ـ').join(' ')}</h2><p>الأخطاء: ${m.errors} / 6</p><div class="mini-alphabet">${[...'ابتثجحخدذرزسشصضطظعغفقكلمنهويأإةء'].map(c=>button(c,'mini-letter:'+c,'quiet tiny',m.done||m.guesses.includes(c))).join('')}</div>`;
  else if(k==='percent')body=`<h2>كم نسبة المربعات الملونة؟</h2><div class="mini-percent" dir="ltr">${Array.from({length:100},(_,i)=>`<i class="${i<m.count?'colored':''}"></i>`).join('')}</div>${miniInput('number')}`;
  else if(k==='flag-color')body=`<p>اختر اللون ثم الجزء.</p><div class="mini-palette">${['#ed334b','#13965a','#ffffff','#172234'].map(c=>`<button data-act="mini-color:${c}" style="background:${c};outline:${m.color===c?'3px solid #67429d':'none'}" aria-label="${c==='#ed334b'?'أحمر':c==='#13965a'?'أخضر':c==='#ffffff'?'أبيض':'أسود'}"></button>`).join('')}</div><div class="mini-flag" dir="ltr">${m.paint.map((c,i)=>`<button data-act="mini-paint:${i}" aria-label="${i===0?'الشريط العمودي':'الشريط الأفقي '+i}" style="background:${c}" ${m.done?'disabled':''}></button>`).join('')}</div>${button('تحقق من العلم','mini-check-flag','primary',m.done)}`;
  else if(['pixels','zoom'].includes(k))body=`<div class="mini-photo"><img src="${m.photo}" alt="صورة التحدي" style="transform:scale(${k==='zoom'?Math.max(1,5-m.step):1});filter:blur(${k==='pixels'?Math.max(0,18-m.step*4):0}px)"></div>${button('وضح الصورة أكثر','mini-clarify','quiet',m.done)}<p>ما طبيعة هذا المنظر؟</p>${miniInput()}`;
  else if(k==='map')body=`<h2>حدد موقع ${m.cities[m.target][0]}</h2><p class="help">خريطة إقليمية مبسطة للمواقع النسبية</p><div class="mini-map"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M12 5L32 8 38 20 61 23 62 36 52 42 31 35 16 30Z M20 43L49 41 60 55 52 91 30 82 20 60Z M62 38L84 45 95 67 77 83 63 62Z" fill="#e6d6b4" stroke="#b69b72"/></svg>${m.cities.map((c,i)=>`<button data-act="mini-answer:${i}" style="left:${c[1]}%;top:${c[2]}%" ${m.done?'disabled':''}>${i+1}</button>`).join('')}</div>${m.done?'<p>'+m.cities.map((c,i)=>(i+1)+': '+c[0]).join(' · ')+'</p>':''}`;
  else if(k==='clues'){const clues=m.prompt[0].split('،');body=`<h2>${esc(clues.slice(0,m.step+1).join('،'))}</h2>${button('تلميح آخر','mini-clarify','quiet',m.done||m.step>=clues.length-1)}${miniInput()}`}
  else if(k==='flash')body=m.phase==='watch'?`<div class="mini-intro-icon">${m.answer}</div>`:`<h2>أي رمز شفت؟</h2><div class="mini-options">${m.options.map(v=>button(v,'mini-flash:'+v,'quiet',m.done)).join('')}</div>`;
  else if(k==='words-memory')body=m.phase==='watch'?`<h2>${m.sequence.join(' ← ')}</h2><p>احفظ الترتيب من اليمين لليسار</p>`:`<p>اختار الكلمة رقم ${m.step+1}</p><div class="mini-options">${['بحر','جبل','قمر','بيت','شمس','نهر'].map(v=>button(v,'mini-sequence:'+v,'quiet',m.done)).join('')}</div>`;
  else if(k==='lights')body=`<p>${m.phase==='watch'?'راقب الإضاءة':'أعد الترتيب'}</p><div class="mini-grid two">${['#ef5077','#39b8b0','#f3b948','#8874d0'].map((c,i)=>`<button class="mini-light ${m.phase==='watch'&&m.tick%2===0&&m.sequence[Math.floor(m.tick/2)]===i?'lit':''}" style="background:${c}" data-act="mini-sequence:${i}" aria-label="لون ${i+1}" ${m.phase==='watch'||m.done?'disabled':''}></button>`).join('')}</div>`;
  else if(k==='cups')body=`<p>${m.phase==='watch'?'تابع الكوب الذي تحته الكرة':'وين الكرة؟'}</p><div class="mini-cups" dir="ltr">${m.order.map((v,i)=>button((m.phase==='watch'&&m.tick===0&&v===m.cup?'⚽':'🥤')+' '+(v+1),'mini-cup:'+i,'quiet',m.phase==='watch'||m.done)).join('')}</div>`;
  else if(k==='chain')body=`<p>${m.words.map(esc).join(' ← ')}</p><h2>كلمة تبدأ بحرف ${esc(m.answer)}</h2>${miniInput()}`;
  else if(k==='ten')body=`<h2>حس بالوقت…</h2>${button('وقف','mini-stop','primary',m.done)}`;
  else if(k==='half')body=`<div class="mini-track"><span id="mini-marker"></span><i></i></div>${button('وقف في النص','mini-stop','primary',m.done)}`;
  else if(k==='tap')body=`<h2><span id="mini-seconds">10</span> ثانية</h2>${button('اضغط! '+m.taps,'mini-tap','primary mini-tap',m.done)}`;
  else if(k==='fly')body=`<div class="mini-sky"><span id="mini-bird" style="top:${m.y}%;left:18%">🪽</span><div id="mini-pipe" style="left:${m.x}%"></div></div>${button('طير ↑','mini-flap','primary',m.done)}`;
  else if(k==='bomb')body=`<div class="mini-intro-icon">💣</div><h2>قولوا: ${esc(m.prompt)}</h2><p>مرروا الجهاز بعد كل إجابة!</p>`;
  else body=`<p><span id="mini-seconds">${m.remaining}</span> ثانية</p>${m.reveal?`<h2>${esc(m.prompt)}</h2>`:button('اعرض الكلمة للاعب','mini-reveal','primary')}<p>${miniDescription(k)}</p>${['draw','blind','line'].includes(k)?`<canvas id="mini-canvas" width="800" height="400" aria-label="لوحة الرسم"></canvas><div class="row">${button('مسح الرسم','mini-clear','quiet')}${k==='blind'?button('كشف الرسم','mini-show-drawing','quiet'):''}</div>`:''}<div class="row">${miniTeamNames().map((n,i)=>button('نقطة لـ '+n,'mini-score:'+i,'quiet',m.done&&m.scored)).join('')}</div>`;
 }
 return `<section class="mini-shell"><div class="row between">${button('رجوع للفئات','mini-back','quiet tiny')}<span class="eyebrow">تحديات اللمة</span></div><h1>${esc(m.title)}</h1><div class="mini-scorebar">${miniTeamNames().map((n,i)=>`<span>${esc(n)} <b>${m.scores[i]}</b></span>`).join('')}</div><div class="mini-play">${body}</div><p class="mini-result" role="status">${esc(m.result)}</p>${m.done&&m.answer?'<p>الإجابة: '+esc(String(m.answer))+'</p>':''}${m.phase!=='intro'?button('تحدي جديد','mini-start','primary'):''}<details><summary>طريقة اللعب</summary><p>${miniDescription(k)}</p></details><p class="help">${pool?'استخدمت '+used+' / '+pool.length+' · '+Math.round(used/pool.length*100)+'% · باقي '+(pool.length-used)+' تحديات جديدة':'تحديات متجددة عشوائيا؛ قد تتشابه الجولات.'}</p></section>`;
}
function miniInput(type='text'){return `<div class="mini-input"><input id="mini-input" type="${type}" autocomplete="off" aria-label="إجابتك" placeholder="اكتب إجابتك" ${mini.done?'disabled':''}>${button('تحقق','mini-submit','primary',mini.done)}</div>`}
const renderBeforeMini=render;
render=function(){if(view==='mini-game'&&mini){$('#app').innerHTML=miniScreen();if(['draw','blind','line'].includes(mini.kind)&&mini.phase==='play')miniCanvas();return}miniStop();renderBeforeMini()};
function miniNorm(s){return String(s).trim().replace(/[ًٌٍَُِّْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')}
function miniCanvas(){const c=$('#mini-canvas');if(!c?.getContext)return;const ctx=c.getContext('2d');ctx.lineWidth=6;ctx.lineCap='round';ctx.strokeStyle='#58348c';if(mini.canvasData){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=mini.canvasData}c.style.opacity=mini.kind==='blind'&&!mini.showDrawing?0.04:1;
 const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*400/r.height]};
 c.addEventListener('pointerdown',e=>{if(mini.done||(mini.kind==='line'&&mini.strokeUsed))return;c.setPointerCapture(e.pointerId);mini.drawing=true;mini.strokeUsed=true;ctx.beginPath();ctx.moveTo(...pos(e))});c.addEventListener('pointermove',e=>{if(!mini.drawing)return;ctx.lineTo(...pos(e));ctx.stroke()});const end=()=>{mini.drawing=false;mini.canvasData=c.toDataURL()};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end)
}
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const [a,arg]=b.dataset.act.split(':');if(a==='mini-open'){miniOpen(arg);return}if(!a.startsWith('mini-')||!mini)return;const m=mini,k=m.kind;
 if(a==='mini-back'){miniStop();go('categories');return}
 if(a==='mini-start'){m.canvasData=null;m.strokeUsed=false;m.showDrawing=false;m.scored=false;miniStart();return}
 if(a==='mini-recycle'){if(confirm('تسمح بإعادة تحديات هاللعبة؟')){const s=miniSeen();s[k]=[];localStorage.setItem('munu-mini-history-v1',JSON.stringify(s));miniStart()}return}
 if(a==='mini-reveal'){m.reveal=true;render();return}
 if(a==='mini-clear'){m.canvasData=null;m.strokeUsed=false;render();return}
 if(a==='mini-show-drawing'){m.showDrawing=true;render();return}
 if(a==='mini-score'&&!m.scored){m.scores[Number(arg)]++;m.scored=true;miniFinish('تم تسجيل النقطة.');return}
 if(m.done)return;
 if(a==='mini-answer')miniCorrect(Number(arg)===(k==='map'?m.target:m.prompt[2]));
 if(a==='mini-number')miniCorrect(Number(arg)===m.answer);
 if(a==='mini-flash')miniCorrect(arg===m.answer);
 if(a==='mini-cup'&&m.phase==='play')miniCorrect(m.order[Number(arg)]===m.cup);
 if(a==='mini-sequence'&&m.phase==='play'){if(String(m.sequence[m.step])!==arg)miniCorrect(false);else if(++m.step===m.sequence.length)miniCorrect(true);else render()}
 if(a==='mini-hide'){m.picked=[];render()}
 if(a==='mini-tile'){const i=Number(arg);if(!Number.isInteger(i)||i<0||i>=m.tiles.length)return;
  if(['find','difference'].includes(k))miniCorrect(i===m.odd);
  if(k==='memory'&&!m.matched.includes(i)&&!m.picked.includes(i)&&m.picked.length<2){m.picked.push(i);if(m.picked.length===2){m.attempts++;if(m.tiles[m.picked[0]]===m.tiles[m.picked[1]]){m.matched.push(...m.picked);m.picked=[];if(m.matched.length===m.tiles.length)miniFinish('طابقت كل البطاقات في '+m.attempts+' محاولات!')}}render()}
  if(k==='puzzle'){if(m.picked.length){const j=m.picked[0];[m.tiles[i],m.tiles[j]]=[m.tiles[j],m.tiles[i]];m.picked=[];if(m.tiles.every((v,n)=>v===n))miniFinish('اكتملت الصورة!')}else m.picked=[i];render()}
  if(k==='trace'){if(m.tiles[i]===m.step+1){m.step++;m.matched.push(i);if(m.step===9)miniFinish('وصلت نهاية الأثر!')}else m.result='اختار الرقم '+(m.step+1);render()}
  if(k==='wall'&&!m.matched.includes(i)){if(m.tiles[i]%m.base===0){m.matched.push(i);if(m.matched.length===m.tiles.filter(v=>v%m.base===0).length)miniFinish('هدمت الجدار الصحيح!')}else m.result='هذا الرقم مو من مضاعفات '+m.base;render()}
 }
 if(a==='mini-color'){m.color=arg;render()}
 if(a==='mini-paint'){m.paint[Number(arg)]=m.color;render()}
 if(a==='mini-check-flag')miniCorrect(m.paint.join(',')==='#ed334b,#13965a,#ffffff,#172234');
 if(a==='mini-clarify'){m.step++;render()}
 if(a==='mini-letter'&&!m.guesses.includes(arg)){m.guesses.push(arg);if(!m.answer.includes(arg))m.errors++;if([...m.answer].every(c=>m.guesses.includes(c)))miniCorrect(true);else if(m.errors>=6)miniFinish('خلصت المحاولات. الكلمة: '+m.answer);else render()}
 if(a==='mini-submit'){const value=$('#mini-input').value;if(!value.trim()){m.result='اكتب إجابتك أول.';render();return}if(k==='chain'){const s=miniNorm(value);if(s.length<2||miniNorm(s[0])!==miniNorm(m.answer)||m.words.some(w=>miniNorm(w)===s)){m.result='لازم كلمة جديدة تبدأ بالحرف المطلوب.'}else{m.words.push(value.trim());m.answer=value.trim().slice(-1);m.result='كلمة جديدة! تأكدوا جماعيا أنها كلمة صحيحة.'}render()}else if(k==='percent'){const n=Number(value);if(!Number.isFinite(n)||n<0||n>100){toast('اكتب نسبة بين 0 و100');return}miniFinish('النسبة '+m.count+'%. الفرق عن إجابتك: '+Math.abs(n-m.count)+'%.')}else miniCorrect(miniNorm(value)===miniNorm(k==='clues'?m.prompt[1]:m.answer))}
 if(a==='mini-tap'){if(Date.now()-m.started>=10000){miniTick();return}m.taps++;render()}
 if(a==='mini-flap')m.velocity=-1.7;
 if(a==='mini-stop'){const value=k==='ten'?(Date.now()-m.started)/1000:m.position||0;miniFinish(k==='ten'?'وقفت عند '+value.toFixed(2)+' ثانية. الفرق '+Math.abs(value-10).toFixed(2)+' ثانية.':'وقفت عند '+value.toFixed(1)+'%. الفرق عن المنتصف '+Math.abs(value-50).toFixed(1)+'%.')}
});

/* REFERENCE MENU JS END */

render();
</script></body></html>
